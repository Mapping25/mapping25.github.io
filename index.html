<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping Earth Studio</title>
<meta name="description" content="Mapping Earth Studio builds Android apps for maps and navigation.">
<style>
  :root { --bg: #f6f8f7; --ink: #14231c; --muted: #53665c; --line: #cfdad4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a15; --ink: #e8f0eb; --muted: #9bb0a5; --line: #2a3a32; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { max-width: 34rem; width: 100%; border-left: 3px solid var(--ink); padding-left: 20px; }
  h1 { font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.1; margin: 0 0 12px; font-weight: 600; }
  p { font-size: 1.1rem; line-height: 1.6; margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Mapping Earth Studio</h1>
    <p>We build Android apps for maps and navigation.</p>
  </main>
</body>
</html>
